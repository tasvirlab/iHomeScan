<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onPointerDown="{{ onDown }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerLeave="{{ onUp }}" style="position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;user-select:none;background-color:var(--plan-bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:18px 18px;font-family:var(--font)">
<sc-if value="{{ isMini }}" hint-placeholder-val="{{ false }}">
<svg viewBox="-500 -500 8800 8600" style="position:absolute;inset:0;width:100%;height:100%">
<rect x="0" y="0" width="7800" height="7600" style="fill:var(--plan-floor)"></rect>
<path d="M0 0H7800V7600H4900M4000 7600H0V0" style="fill:none;stroke:var(--wall);stroke-width:300;stroke-linecap:square"></path>
<path d="M4200 0V4800M0 4800H3300M4100 4800H4500M5300 4800H7800M3000 4800V5200M3000 5900V7600M5800 4800V6600M5800 7300V7600" style="fill:none;stroke:var(--wall);stroke-width:200;stroke-linecap:square"></path>
</svg>
</sc-if>
<sc-if value="{{ is2d }}" hint-placeholder-val="{{ true }}">
<div style="position:absolute;inset:0;transform-origin:50% 50%;transform:{{ view2d }}">
<svg viewBox="-1150 -1150 10100 9950" style="position:absolute;inset:0;width:100%;height:100%">
<rect x="0" y="0" width="7800" height="7600" style="fill:var(--plan-floor)"></rect>
<path d="M0 0H7800V7600H4900M4000 7600H0V0" style="fill:none;stroke:var(--wall);stroke-width:220;stroke-linecap:square"></path>
<path d="M4200 0V4800M0 4800H3300M4100 4800H4500M5300 4800H7800M3000 4800V5200M3000 5900V7600M5800 4800V6600M5800 7300V7600" style="fill:none;stroke:var(--wall);stroke-width:130;stroke-linecap:square"></path>
<path d="M3300 4800V4000A800 800 0 0 1 4100 4800M5300 4800V4000A800 800 0 0 0 4500 4800M3000 5200H2300A700 700 0 0 0 3000 5900M5800 7300H6500A700 700 0 0 0 5800 6600M4000 7600V6700A900 900 0 0 1 4900 7600" style="fill:none;stroke:var(--ink-3);stroke-width:22"></path>
<g style="fill:var(--plan-floor);stroke:var(--wall);stroke-width:26">
<rect x="1200" y="-110" width="1800" height="220"></rect>
<rect x="5100" y="-110" width="1800" height="220"></rect>
<rect x="-110" y="5500" width="220" height="1400"></rect>
<rect x="7690" y="1500" width="220" height="1700"></rect>
</g>
<path d="M1200 0H3000M5100 0H6900M0 5500V6900M7800 1500V3200" style="stroke:var(--wall);stroke-width:22"></path>
</svg>
<sc-if value="{{ isDraft }}" hint-placeholder-val="{{ false }}">
<svg viewBox="-1150 -1150 10100 9950" style="position:absolute;inset:0;width:100%;height:100%">
<path d="M0 -700H7800M0 -200V-850M4200 -200V-850M7800 -200V-850M-700 0V7600M-200 0H-850M-200 4800H-850M-200 7600H-850M0 8300H7800M0 7800V8450M3000 7800V8450M5800 7800V8450M7800 7800V8450M8500 0V7600M8000 0H8650M8000 7600H8650" style="fill:none;stroke:var(--dim);stroke-width:16"></path>
<path d="M-90 -610L90 -790M4110 -610L4290 -790M7710 -610L7890 -790M-790 90L-610 -90M-790 4890L-610 4710M-790 7690L-610 7510M-90 8390L90 8210M2910 8390L3090 8210M5710 8390L5890 8210M7710 8390L7890 8210M8410 90L8590 -90M8410 7690L8590 7510" style="stroke:var(--dim);stroke-width:40"></path>
</svg>
</sc-if>
<sc-if value="{{ isFocus }}" hint-placeholder-val="{{ false }}">
<svg viewBox="-1150 -1150 10100 9950" style="position:absolute;inset:0;width:100%;height:100%">
<rect x="{{ hx }}" y="{{ hy }}" width="{{ hw }}" height="{{ hh }}" rx="140" style="fill:var(--accent);fill-opacity:0.1;stroke:var(--accent);stroke-width:36"></rect>
<path d="{{ dimPath }}" style="fill:none;stroke:var(--accent-text);stroke-width:20"></path>
<path d="{{ tickPath }}" style="stroke:var(--accent-text);stroke-width:40"></path>
<g style="fill:transparent;cursor:pointer">
<rect x="0" y="0" width="4200" height="4800" onClick="{{ selLiving }}"></rect>
<rect x="4200" y="0" width="3600" height="4800" onClick="{{ selBed }}"></rect>
<rect x="0" y="4800" width="3000" height="2800" onClick="{{ selKitchen }}"></rect>
<rect x="3000" y="4800" width="2800" height="2800" onClick="{{ selHall }}"></rect>
<rect x="5800" y="4800" width="2000" height="2800" onClick="{{ selBath }}"></rect>
</g>
</svg>
</sc-if>
{{ labels }}
</div>
</sc-if>
<sc-if value="{{ is3d }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;inset:0;perspective:1100px;cursor:grab">
<div style="position:absolute;left:6%;top:4%;width:88%;height:88%;transform-style:preserve-3d;transform-origin:50% 50%;transform:{{ cam }}">
<svg viewBox="-500 -500 8800 8600" style="position:absolute;inset:0;width:100%;height:100%">
<rect x="0" y="0" width="7800" height="7600" style="fill:var(--plan-floor)"></rect>
<rect x="{{ hx }}" y="{{ hy }}" width="{{ hw }}" height="{{ hh }}" style="fill:var(--accent);fill-opacity:0.14"></rect>
</svg>
<sc-for list="{{ layers }}" as="l" hint-placeholder-count="0">
<svg viewBox="-500 -500 8800 8600" style="position:absolute;inset:0;width:100%;height:100%;color:{{ l.c }};transform:{{ l.t }}">
<path d="M0 0H7800V7600H4900M4000 7600H0V0" fill="none" stroke="currentColor" stroke-width="220" stroke-linecap="square"></path>
<path d="M4200 0V4800M0 4800H3300M4100 4800H4500M5300 4800H7800M3000 4800V5200M3000 5900V7600M5800 4800V6600M5800 7300V7600" fill="none" stroke="currentColor" stroke-width="130" stroke-linecap="square"></path>
</svg>
</sc-for>
</div>
<div style="position:absolute;left:12px;bottom:12px;padding:6px 11px;border-radius:999px;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:0.5px solid var(--line);font:500 12px var(--font);color:var(--ink-2)">{{ hint3d }}</div>
</div>
</sc-if>
<sc-if value="{{ showUnit }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;left:12px;bottom:12px;padding:6px 11px;border-radius:999px;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:0.5px solid var(--line);font:500 12px var(--mono);color:var(--ink-2)">{{ unitLabel }}</div>
</sc-if>
<sc-if value="{{ controls }}" hint-placeholder-val="{{ false }}">
<div style="position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:8px;align-items:center">
<div style="display:flex;flex-direction:column;background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:0.5px solid var(--line);border-radius:999px;overflow:hidden">
<button onClick="{{ zoomIn }}" style="width:40px;height:40px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
<div style="height:0.5px;background:var(--line);margin:0 9px"></div>
<button onClick="{{ zoomOut }}" style="width:40px;height:40px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
</div>
<button onClick="{{ reset }}" style="width:40px;height:40px;border-radius:999px;border:0.5px solid var(--line);background:var(--bar);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);display:grid;place-items:center;cursor:pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg></button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:480},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;draft&quot;,&quot;focus&quot;,&quot;plain&quot;,&quot;mini&quot;],&quot;default&quot;:&quot;draft&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;2d&quot;,&quot;3d&quot;],&quot;default&quot;:&quot;2d&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;units&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mm&quot;,&quot;m&quot;],&quot;default&quot;:&quot;mm&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lang&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;uz&quot;,&quot;en&quot;,&quot;ru&quot;],&quot;default&quot;:&quot;uz&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;controls&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;living&quot;,&quot;bed&quot;,&quot;kitchen&quot;,&quot;hall&quot;,&quot;bath&quot;],&quot;default&quot;:&quot;bed&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id: string) =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { z: 1, tx: 0, ty: 0, rot: -32, sel: null };
  drag = null;
  R = [
    { id: 'living', x: 0, y: 0, w: 4200, h: 4800, cx: 2100, cy: 2500, a: '20,2' },
    { id: 'bed', x: 4200, y: 0, w: 3600, h: 4800, cx: 6000, cy: 2500, a: '17,3' },
    { id: 'kitchen', x: 0, y: 4800, w: 3000, h: 2800, cx: 1400, cy: 6300, a: '8,4' },
    { id: 'hall', x: 3000, y: 4800, w: 2800, h: 2800, cx: 4400, cy: 6200, a: '7,8' },
    { id: 'bath', x: 5800, y: 4800, w: 2000, h: 2800, cx: 6800, cy: 5900, a: '5,6' }
  ];
  N = { living: ['Mehmonxona', 'Living room', 'Гостиная'], bed: ['Yotoqxona', 'Bedroom', 'Спальня'], kitchen: ['Oshxona', 'Kitchen', 'Кухня'], hall: ['Koridor', 'Hallway', 'Коридор'], bath: ['Hammom', 'Bathroom', 'Санузел'] };
  A = { living: 20.16, bed: 17.28, kitchen: 8.4, hall: 7.84, bath: 5.6 };
  li() { return { uz: 0, en: 1, ru: 2 }[this.props.lang ?? 'uz'] ?? 0; }
  fmt(mm) {
    const en = this.li() === 1;
    if ((this.props.units ?? 'mm') === 'm') return (mm / 1000).toFixed(2).replace('.', en ? '.' : ',');
    return String(mm).replace(/\B(?=(\d{3})+(?!\d))/g, en ? ',' : '\u202F');
  }
  pick(id) { this.setState({ sel: id }); this.props.onSelect && this.props.onSelect(id); }
  renderVals() {
    const kind = this.props.kind ?? 'draft';
    const mode = this.props.mode ?? '2d';
    const controls = !!this.props.controls;
    const s = this.state;
    const selId = this.props.selected ?? s.sel ?? 'bed';
    const r = this.R.find(x => x.id === selId) || this.R[1];
    const isMini = kind === 'mini';
    const is3d = !isMini && mode === '3d';
    const is2d = !isMini && !is3d;
    const t = (x, y) => `M${x - 90} ${y + 90}L${x + 90} ${y - 90}`;
    const wy = r.y + 480, x1 = r.x + 260, x2 = r.x + r.w - 260, hx0 = r.x + 480, y1 = r.y + 260, y2 = r.y + r.h - 260;
    const f = this.fmt.bind(this);
    const u = (this.props.units ?? 'mm') === 'm' ? 'm' : 'mm';
    const li = this.li();
    const nm = {}, ar = {};
    Object.keys(this.N).forEach(k => { nm[k] = this.N[k][li]; ar[k] = this.A[k].toFixed(1).replace('.', li === 1 ? '.' : ',') + (li === 2 ? ' м²' : ' m²'); });
    const wallTop = 'var(--wall)', wallSide = 'var(--wall-side)';
    const E = React.createElement;
    const tx = (x, y, s, st, rot, key) => E('text', { key, x, y, textAnchor: 'middle', transform: rot ? `rotate(${rot} ${x} ${y})` : undefined, style: st }, s);
    const fName = { font: '600 290px ' + 'var(--font)', fill: 'var(--ink)' };
    const fArea = { font: '500 220px var(--mono)', fill: 'var(--ink-2)' };
    const fDim = { font: '500 220px var(--mono)', fill: 'var(--dim)' };
    const fSel = { font: '600 220px var(--mono)', fill: 'var(--accent-text)' };
    const kids = [];
    if (is2d) {
      this.R.forEach(rr => kids.push(tx(rr.cx, rr.cy, nm[rr.id], fName, 0, 'n' + rr.id)));
      if (kind === 'draft') {
        this.R.forEach(rr => kids.push(tx(rr.cx, rr.cy + 360, ar[rr.id], fArea, 0, 'a' + rr.id)));
        [[2100, -800, 4200, 0], [6000, -800, 3600, 0], [-800, 2400, 4800, -90], [-800, 6200, 2800, -90], [1500, 8590, 3000, 0], [4400, 8590, 2800, 0], [6800, 8590, 2000, 0], [8600, 3800, 7600, 90]]
          .forEach(([x, y, v, rot], k) => kids.push(tx(x, y, f(v), fDim, rot, 'd' + k)));
      }
      if (kind === 'focus') {
        kids.push(tx(r.x + r.w / 2 + 200, wy - 90, f(r.w), fSel, 0, 'fw'));
        kids.push(tx(hx0 - 90, r.y + r.h / 2 + 300, f(r.h), fSel, -90, 'fh'));
        kids.push(tx(r.cx, r.cy + 360, ar[r.id], fSel, 0, 'fa'));
      }
    }
    const labels = kids.length ? E('svg', { viewBox: '-1150 -1150 10100 9950', style: { position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none' } }, kids) : null;
    return {
      labels,
      isMini, is2d, is3d, controls,
      isDraft: kind === 'draft', isFocus: kind === 'focus',
      showUnit: controls && is2d,
      unitLabel: [['Oʻlchov: mm', 'Units: mm', 'Единицы: мм'], ['Oʻlchov: metr', 'Units: m', 'Единицы: м']][u === 'm' ? 1 : 0][li],
      hint3d: ['Aylantirish uchun suring', 'Drag to rotate', 'Проведите, чтобы вращать'][li],
      nm, ar,
      d4200: f(4200), d3600: f(3600), d4800: f(4800), d2800: f(2800), d3000: f(3000), d2000: f(2000), d7600: f(7600),
      hx: r.x + 110, hy: r.y + 110, hw: r.w - 220, hh: r.h - 220,
      dimPath: `M${x1} ${wy}H${x2}M${hx0} ${y1}V${y2}`,
      tickPath: t(x1, wy) + t(x2, wy) + t(hx0, y1) + t(hx0, y2),
      wtx: r.x + r.w / 2 + 200, wty: wy - 90, wLabel: f(r.w),
      htx: hx0 - 90, hty: r.y + r.h / 2 + 300, hRot: `rotate(-90 ${hx0 - 90} ${r.y + r.h / 2 + 300})`, hLabel: f(r.h),
      cx: r.cx, ay: r.cy + 360, areaLabel: ar[r.id],
      selLiving: () => this.pick('living'), selBed: () => this.pick('bed'), selKitchen: () => this.pick('kitchen'),
      selHall: () => this.pick('hall'), selBath: () => this.pick('bath'),
      view2d: `translate(${s.tx}px, ${s.ty}px) scale(${s.z})`,
      cam: `rotateX(56deg) rotateZ(${s.rot}deg) scale(${(0.62 * s.z).toFixed(3)})`,
      layers: is3d ? Array.from({ length: 22 }, (_, i) => ({ t: `translateZ(${i * 2}px)`, c: i === 21 ? wallTop : wallSide })) : [],
      zoomIn: () => this.setState(p => ({ z: Math.min(3, +(p.z * 1.25).toFixed(3)) })),
      zoomOut: () => this.setState(p => ({ z: Math.max(0.6, +(p.z / 1.25).toFixed(3)) })),
      reset: () => this.setState({ z: 1, tx: 0, ty: 0, rot: -32 }),
      onDown: e => { if (!controls) return; this.drag = { x: e.clientX, y: e.clientY, tx: s.tx, ty: s.ty, rot: s.rot }; },
      onMove: e => {
        const d = this.drag; if (!d) return;
        const dx = e.clientX - d.x, dy = e.clientY - d.y;
        if (Math.abs(dx) + Math.abs(dy) < 3) return;
        if (is3d) this.setState({ rot: d.rot + dx * 0.4 });
        else this.setState({ tx: d.tx + dx, ty: d.ty + dy });
      },
      onUp: () => { this.drag = null; }
    };
  }
}
</script>
</body>
</html>
